
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeLink Blood Donation</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(to right,#ce1515,#600404);
    font-family:Arial, sans-serif;
    background-image:url( "/static/images/background.png" );
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.home-card{
    background:white;
    padding:40px;
    border-radius:20px;
    text-align:center;
    width:450px;
    box-shadow:0 5px 20px rgba(0,0,0,0.2);
}

.logo{
    font-size:60px;
}

h1{
    color:#900404;
    font-weight:bold;
}

.tagline{
    color:#666;
    margin-bottom:30px;
}

.btn-custom{
    width:100%;
    margin-top:10px;
    padding:10px;
    font-size:18px;
}

.btn-login{
    background:#900404;
    color:white;
}

.btn-login:hover{
    background:#600404;
    color:white;
}

.btn-register{
    background:#ce1515;
    color:white;
}

.btn-register:hover{
    background:#900404;
    color:white;
}
</style>
</head>

<body>

<div class="home-card">

    <div class="logo"></div>

    <h1>LifeLink Blood Donation</h1>

    <p class="tagline">
        Donate Blood, Save Lives. Every Drop Counts.
    </p>

    <a href="/bloodapp/login_get/" class="btn btn-login btn-custom">
        Login
    </a>

    <a href="/bloodapp/get_userregister/" class="btn btn-register btn-custom">
        Register
    </a>

</div>

</body>
</html>
