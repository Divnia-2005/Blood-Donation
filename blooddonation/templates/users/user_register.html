<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register User Here!</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(to right,#ce151595 0%,#600404 100%);
    background-image:url( "/static/images/background.png" );
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
.register-card{
    background:#f9f9fa;
    margin:0 auto;
    padding:20px;
    width:400px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(59,97,144,0.2);
}
.btn-primary{
    background: #cf292997;
}
.btn-primary:hover{
    background: #90040497;
}
</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="register-card">

<h2 class="text-center mb-3">Register User</h2>

<form action="/bloodapp/post_userregister/" method="post">

    {% csrf_token %}

    <input type="text"
           name="name"
           placeholder="Name"
           class="form-control mb-2"
           required
           pattern="[A-Za-z ]{3,50}"
           title="Name should contain only letters and spaces">

    <input type="email"
           name="email"
           placeholder="Email"
           class="form-control mb-2"
           required>

    <input type="password"
           name="password"
           placeholder="Password"
           class="form-control mb-2"
           required
           minlength="6"
           title="Password must contain at least 6 characters">

    <input type="tel"
           name="phoneno"
           placeholder="Phone number"
           class="form-control mb-2"
           required
           pattern="[0-9]{10}"
           title="Enter a valid 10 digit phone number">

    <input type="text"
           name="place"
           placeholder="Place"
           class="form-control mb-2"
           required
           pattern="[A-Za-z ]{2,50}"
           title="Place should contain only letters">

    <label class="form-label">Date of Birth</label>

    <input type="date"
           name="dob"
           class="form-control mb-2"
           required>

    <label class="form-label">Gender</label><br>

    <input type="radio" name="gender" value="Male" required> Male

    <input type="radio" name="gender" value="Female"> Female

    <input type="radio" name="gender" value="Other"> Other

    <br><br>

  <input type="text"
       name="bloodgroup"
       id="bloodgroup"
       placeholder="Blood Group"
       class="form-control mb-1"
       required>

<small id="bloodError" class="text-danger"></small>

    <button class="btn btn-primary form-control">
        Register
    </button>

    <div class="text-center mt-3">
        <p class="mb-0">
            Already have an account?
            <a href="/bloodapp/login_get/" class="text-decoration-none">
                Login Here
            </a>
        </p>
    </div>

</form>

</div>
<script>
document.getElementById("bloodgroup").addEventListener("input", function(){

    let bloodgroup = this.value.toUpperCase().trim();

    let validGroups = [
        "A+","A-",
        "B+","B-",
        "AB+","AB-",
        "O+","O-"
    ];

    let error = document.getElementById("bloodError");

    if(bloodgroup === ""){
        error.innerHTML = "";
    }
    else if(!validGroups.includes(bloodgroup)){
        error.innerHTML = "Invalid Blood Group";
    }
    else{
        error.innerHTML = "";
    }
});
</script>
</body>
</html>
