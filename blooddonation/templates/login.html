<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login User Here!</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:linear-gradient(to right,#ce151595 0%,#600404 100%);
    background-image:url( "/static/images/background.png" );
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
.login-card{
    background:#f9f9fa;
    margin:0 auto;
    padding:20px;
    width:350px;
    border-radius:20px;
    box-shadow:0 4px 15px rgba(59,97,144,0.2);
}
.btn-primary{
    background: #cf292997
}
.btn-primary:hover
{
    background: #90040497
}
</style>
</head>

<body class="d-flex justify-content-center align-items-center vh-100">

<div class="login-card">

<h2 class="text-center mb-3">Login</h2>

<form action="/bloodapp/login_post/" method="post">

    

    <input type="text" name="username" placeholder="Email" class="form-control mb-3">

    <input type="password" name="password" placeholder="Password" class="form-control mb-3">

    <button class="btn btn-primary form-control">
        Login
    </button>
    <div class="text-center mt-3">
    <p class="mb-0">
        Don't have an account?
        <a href="/bloodapp/get_userregister/" class="text-decoration-none">
            Sign Up
        </a>
    </p>
</div>
</form>

</div>

</body>
</html>
